name: App build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    name: Build iPhone and Watch apps (simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          XCODE_PATH=/Applications/Xcode_26.6.app
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Expected newest stable Xcode at $XCODE_PATH; available Xcodes follow"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      # The generated FreeLunch.xcodeproj is committed, so xcodegen is not
      # needed here. Signing is off: simulator builds need no profile.
      - name: Build iPhone app with embedded Watch app
        run: |
          xcodebuild -project FreeLunch.xcodeproj -scheme FreeLunchPhone \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd build CODE_SIGNING_ALLOWED=NO

      - name: Build Watch app
        run: |
          xcodebuild -project FreeLunch.xcodeproj -scheme FreeLunchWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/dd build CODE_SIGNING_ALLOWED=NO

      - name: Select available simulators
        run: |
          set -euo pipefail
          IPHONE_UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone"))) | .udid] | first // empty')
          WATCH_UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("Apple Watch"))) | .udid] | first // empty')
          test -n "$IPHONE_UDID"
          test -n "$WATCH_UDID"
          echo "IPHONE_UDID=$IPHONE_UDID" >> "$GITHUB_ENV"
          echo "WATCH_UDID=$WATCH_UDID" >> "$GITHUB_ENV"
          # Boot ahead of time: cold-booting inside xcodebuild test made the
          # first launch flaky on hosted runners.
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          xcrun simctl bootstatus "$WATCH_UDID" -b

      - name: Test iPhone app placeholder empty state
        run: |
          xcodebuild test -project FreeLunch.xcodeproj -scheme FreeLunchPhone \
            -destination "id=$IPHONE_UDID" \
            -derivedDataPath build/dd -retry-tests-on-failure CODE_SIGNING_ALLOWED=NO

      - name: Test Watch app placeholder empty state
        run: |
          xcodebuild test -project FreeLunch.xcodeproj -scheme FreeLunchWatch \
            -destination "id=$WATCH_UDID" \
            -derivedDataPath build/dd -retry-tests-on-failure CODE_SIGNING_ALLOWED=NO

      - name: Verify bundle identifiers and plist keys
        run: |
          set -euo pipefail
          P=$(find build/dd -path '*Debug-iphonesimulator/FreeLunchPhone.app' -type d | head -1)
          W=$(find build/dd -path '*Debug-watchsimulator/FreeLunchWatch.app' -type d | head -1)
          test -n "$P" && test -n "$W"
          test -d "$P/Watch/FreeLunchWatch.app"
          E="$P/Watch/FreeLunchWatch.app"
          pb() { /usr/libexec/PlistBuddy -c "Print :$2" "$1/Info.plist"; }
          [[ "$(pb "$P" CFBundleIdentifier)" == "com.freelunch.nutrition" ]]
          [[ "$(pb "$W" CFBundleIdentifier)" == "com.freelunch.nutrition.watchkitapp" ]]
          [[ "$(pb "$E" CFBundleIdentifier)" == "com.freelunch.nutrition.watchkitapp" ]]
          [[ "$(pb "$P" CFBundleDisplayName)" == "Free Lunch" ]]
          [[ "$(pb "$W" CFBundleDisplayName)" == "Free Lunch" ]]
          [[ "$(pb "$P" ITSAppUsesNonExemptEncryption)" == "false" ]]
          [[ "$(pb "$W" ITSAppUsesNonExemptEncryption)" == "false" ]]
          [[ "$(pb "$W" WKCompanionAppBundleIdentifier)" == "com.freelunch.nutrition" ]]
          [[ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" FreeLunchPhone/FreeLunchPhone.entitlements)" == "true" ]]
          [[ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" FreeLunchWatch/FreeLunchWatch.entitlements)" == "true" ]]
          # The HealthKit entitlement obliges every bundle that carries it to
          # have both Health purpose strings. App Store Connect enforces this
          # only when an upload is analysed (error 90683), which neither this
          # simulator build nor the release dry run reaches; the first fl-m0
          # upload was refused because the Watch app lacked the update string.
          for B in "$P" "$W" "$E"; do
            for K in NSHealthShareUsageDescription NSHealthUpdateUsageDescription; do
              [[ -n "$(pb "$B" "$K")" ]] || { echo "::error::$K missing from $B"; exit 1; }
            done
          done
          echo OK
