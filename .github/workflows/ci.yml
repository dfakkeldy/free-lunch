name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: FreeLunchKit package tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same pin as Burly: GitHub's macos-26 image documents Xcode 26.6 as
      # the newest stable Xcode at this path. Fail with the installed paths
      # in the log when the runner image changes so the pin can be reviewed.
      - name: Select Xcode 26.6
        run: |
          XCODE_PATH=/Applications/Xcode_26.6.app
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Expected newest stable Xcode at $XCODE_PATH; available Xcodes follow"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Run Swift package tests
        working-directory: FreeLunchKit
        run: swift test

  sim-acceptance:
    name: Simulator acceptance
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'sim-acceptance'))
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same pin as Burly: GitHub's macos-26 image documents Xcode 26.6 as
      # the newest stable Xcode at this path. Fail with the installed paths
      # in the log when the runner image changes so the pin can be reviewed.
      - name: Select Xcode 26.6
        run: |
          XCODE_PATH=/Applications/Xcode_26.6.app
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Expected newest stable Xcode at $XCODE_PATH; available Xcodes follow"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve newest simulator specifications
        id: simulator-spec
        run: |
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          xcrun simctl list devicetypes --json > "$RUNNER_TEMP/devicetypes.json"
          /usr/bin/python3 - "$RUNNER_TEMP/runtimes.json" "$RUNNER_TEMP/devicetypes.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          runtimes_path, device_types_path, output_path = sys.argv[1:]

          with open(runtimes_path) as handle:
              runtimes = json.load(handle).get("runtimes", [])
          with open(device_types_path) as handle:
              device_types = json.load(handle).get("devicetypes", [])

          def version_key(value):
              return tuple(int(part) for part in re.findall(r"[0-9]+", value))

          def newest(items, description, predicate):
              matches = [item for item in items if item.get("isAvailable", True) and predicate(item)]
              if not matches:
                  raise SystemExit(f"no available {description} found")
              return max(
                  matches,
                  key=lambda item: version_key(f"{item.get('name', '')} {item.get('identifier', '')}"),
              )

          iphone_runtime = newest(
              runtimes,
              "iOS runtime",
              lambda item: ".iOS-" in item.get("identifier", ""),
          )
          watch_runtime = newest(
              runtimes,
              "watchOS runtime",
              lambda item: ".watchOS-" in item.get("identifier", ""),
          )
          iphone_type = newest(
              device_types,
              "iPhone device type",
              lambda item: item.get("name", "").startswith("iPhone"),
          )
          watch_type = newest(
              device_types,
              "46mm Apple Watch device type",
              lambda item: item.get("name", "").startswith("Apple Watch") and "46mm" in item.get("name", ""),
          )

          outputs = {
              "iphone_runtime": iphone_runtime["identifier"],
              "iphone_type": iphone_type["identifier"],
              "watch_runtime": watch_runtime["identifier"],
              "watch_type": watch_type["identifier"],
              "iphone_name": "Free Lunch iPhone",
              "watch_name": "Free Lunch Watch S11 46mm",
          }
          with open(output_path, "a") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
                  print(f"{key}={value}")
          PY

      - name: Create and pair acceptance simulators
        run: |
          IPHONE_UDID="$(xcrun simctl create "${{ steps.simulator-spec.outputs.iphone_name }}" "${{ steps.simulator-spec.outputs.iphone_type }}" "${{ steps.simulator-spec.outputs.iphone_runtime }}")"
          WATCH_UDID="$(xcrun simctl create "${{ steps.simulator-spec.outputs.watch_name }}" "${{ steps.simulator-spec.outputs.watch_type }}" "${{ steps.simulator-spec.outputs.watch_runtime }}")"
          xcrun simctl pair "$WATCH_UDID" "$IPHONE_UDID"
          xcrun simctl list pairs

      - name: Run simulator acceptance
        env:
          FL_LOCK_DIR: ${{ runner.temp }}/free-lunch-sim.lock
        run: Scripts/acceptance-sim.sh

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-acceptance-${{ github.run_id }}
          path: Scripts/output/latest/**
          if-no-files-found: warn
