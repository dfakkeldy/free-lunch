name: FreeLunch

options:
  bundleIdPrefix: com.freelunch
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 8AXNA5B37R
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

packages:
  FreeLunchKit:
    path: FreeLunchKit

targets:
  FreeLunchPhone:
    type: application
    platform: iOS
    sources:
      - FreeLunchPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freelunch.nutrition
        PRODUCT_NAME: "$(TARGET_NAME)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Free Lunch"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Free Lunch reads body weight and energy burned to compute energy balance."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Free Lunch saves logged food energy and nutrients to Health."
        CODE_SIGN_ENTITLEMENTS: FreeLunchPhone/FreeLunchPhone.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FreeLunchKit
        product: FLCore
      - package: FreeLunchKit
        product: FLEnergyCore
      - package: FreeLunchKit
        product: FLPlate
      - package: FreeLunchKit
        product: FLPersistence
      - target: FreeLunchWatch
        embed: true

  FreeLunchWatch:
    type: application
    platform: watchOS
    sources:
      - FreeLunchWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freelunch.nutrition.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Free Lunch"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.freelunch.nutrition
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Free Lunch reads body weight and energy burned to compute energy balance."
        CODE_SIGN_ENTITLEMENTS: FreeLunchWatch/FreeLunchWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FreeLunchKit
        product: FLCore

  FreeLunchPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FreeLunchPhoneUITests
    testTarget: FreeLunchPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freelunch.nutrition.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "$(inherited)"

  FreeLunchWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - FreeLunchWatchUITests
    testTarget: FreeLunchWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freelunch.nutrition.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "$(inherited)"

schemes:
  FreeLunchPhone:
    build:
      targets:
        FreeLunchPhone: all
    run:
      config: Debug
      executable: FreeLunchPhone
    test:
      targets:
        - FreeLunchPhoneUITests
  FreeLunchWatch:
    build:
      targets:
        FreeLunchWatch: all
    run:
      config: Debug
      executable: FreeLunchWatch
    test:
      targets:
        - FreeLunchWatchUITests
